<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Asistente Gemini Multimodal</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .chat-card { width: 100%; max-width: 600px; height: 85vh; background: #1e293b; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid #334155; }
    .chat-header { padding: 18px 24px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; }
    
    .clear-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .clear-btn:hover { background: #ef444422; color: #ef4444; border-color: #ef4444; }

    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.model { align-self: flex-start; }

    .msg { padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; }
    
    .user .msg { background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .model .msg { background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
    .model .msg p { margin-bottom: 8px; }
    .model .msg p:last-child { margin-bottom: 0; }
    .img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; object-fit: contain; }

    /* Botón de copiar */
    .msg-actions { display: flex; gap: 8px; margin-top: 4px; align-self: flex-start; }
    .copy-btn { background: transparent; border: none; color: #64748b; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; transition: color 0.2s; }
    .copy-btn:hover { color: #94a3b8; background: #33415555; }
    
    /* Animación de carga (Typing Indicator) */
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
    .typing-dots span { width: 6px; height: 6px; background-color: #94a3b8; border-radius: 50%; animation: blink 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }

    .preview-bar { padding: 8px 16px; background: #0f172a; display: none; align-items: center; gap: 10px; border-top: 1px solid #334155; }
    .preview-bar img { height: 40px; border-radius: 6px; }
    .remove-img { color: #ef4444; cursor: pointer; font-weight: bold; font-size: 14px; margin-left: auto; }

    .input-container { padding: 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    textarea { flex: 1; height: 48px; background: #1e293b; border: 1px solid #475569; border-radius: 10px; color: #fff; padding: 12px; font-size: 14px; resize: none; outline: none; transition: border 0.2s; }
    textarea:focus { border-color: #3b82f6; }
    
    .file-btn { background: #334155; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .file-btn:hover { background: #475569; }
    button { background: #2563eb; color: white; border: none; padding: 0 20px; height: 48px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <div class="header-info">
        <span class="status-dot"></span>
        <h3 style="font-size: 16px; font-weight: 600;">Gemini Assistant (Multimodal)</h3>
      </div>
      <button class="clear-btn" onclick="borrarHistorial()">🗑️ Borrar Chat</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="preview-bar" id="previewBar">
      <img id="imgPreview" src="" alt="Vista previa">
      <span style="font-size: 12px; color: #94a3b8;">Imagen lista</span>
      <span class="remove-img" onclick="quitarImagen()">✕</span>
    </div>

    <div class="input-container">
      <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="seleccionarImagen(event)">
      <button class="file-btn" onclick="document.getElementById('fileInput').click()">📷</button>
      <textarea id="promptInput" placeholder="Escribe un mensaje..."></textarea>
      <button id="sendBtn" onclick="enviarConsulta()">Enviar</button>
    </div>
  </div>

  <script>
    let history = [];
    let uiHistory = [];
    let selectedImageData = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedHistory = localStorage.getItem('gemini_history');
      const savedUiHistory = localStorage.getItem('gemini_ui_history');

      if (savedHistory && savedUiHistory) {
        history = JSON.parse(savedHistory);
        uiHistory = JSON.parse(savedUiHistory);
        renderUiHistory();
      } else {
        document.getElementById('chatBox').innerHTML = `<div class="msg-wrapper model"><div class="msg">¡Hola! 👋 Envía una imagen o una pregunta para ayudarte.</div></div>`;
      }
    });

    function guardarEnLocalStorage() {
      localStorage.setItem('gemini_history', JSON.stringify(history));
      localStorage.setItem('gemini_ui_history', JSON.stringify(uiHistory));
    }

    function renderUiHistory() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      uiHistory.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${item.role}`;
        
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = item.role === 'model' ? marked.parse(item.html) : item.html;
        wrapper.appendChild(div);

        if (item.role === 'model') {
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          actions.innerHTML = `<button class="copy-btn" onclick="copiarTexto(this)">📋 Copiar</button>`;
          wrapper.appendChild(actions);
        }

        chatBox.appendChild(wrapper);
      });
      autoScroll();
    }

    function autoScroll() {
      const chatBox = document.getElementById('chatBox');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copiarTexto(btn) {
      const msgDiv = btn.closest('.msg-wrapper').querySelector('.msg');
      const texto = msgDiv.innerText;
      navigator.clipboard.writeText(texto).then(() => {
        btn.innerHTML = '✅ Copiado';
        setTimeout(() => { btn.innerHTML = '📋 Copiar'; }, 2000);
      });
    }

    function borrarHistorial() {
      localStorage.removeItem('gemini_history');
      localStorage.removeItem('gemini_ui_history');
      history = [];
      uiHistory = [];
      document.getElementById('chatBox').innerHTML = `<div class="msg-wrapper model"><div class="msg">¡Hola! 👋 Envía una imagen o una pregunta para ayudarte.</div></div>`;
    }

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarConsulta();
      }
    });

    function seleccionarImagen(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);
          const base64String = compressedDataUrl.split(',')[1];

          selectedImageData = {
            inlineData: {
              mimeType: 'image/jpeg',
              data: base64String
            }
          };

          document.getElementById('imgPreview').src = compressedDataUrl;
          document.getElementById('previewBar').style.display = 'flex';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function quitarImagen() {
      selectedImageData = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('previewBar').style.display = 'none';
    }

    async function enviarConsulta() {
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim();
      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');

      if (!prompt && !selectedImageData) return;

      const currentParts = [];
      const historyParts = [];
      let userHtml = '';

      if (selectedImageData) {
        currentParts.push(selectedImageData);
        const imgSrc = `data:${selectedImageData.inlineData.mimeType};base64,${selectedImageData.inlineData.data}`;
        userHtml += `<img src="${imgSrc}" class="img-preview">`;
      }

      if (prompt) {
        currentParts.push({ text: prompt });
        historyParts.push({ text: prompt });
        userHtml += `<div>${prompt}</div>`;
      } else if (selectedImageData) {
        historyParts.push({ text: "[Imagen enviada por el usuario]" });
      }

      // Render del mensaje del usuario
      const userWrapper = document.createElement('div');
      userWrapper.className = 'msg-wrapper user';
      userWrapper.innerHTML = `<div class="msg">${userHtml}</div>`;
      chatBox.appendChild(userWrapper);
      uiHistory.push({ role: 'user', html: userHtml });

      const payloadContents = [
        ...history,
        { role: 'user', parts: currentParts }
      ];

      history.push({ role: 'user', parts: historyParts });

      input.value = '';
      quitarImagen();
      sendBtn.disabled = true;

      // Render del placeholder con animación "Escribiendo..."
      const modelWrapper = document.createElement('div');
      modelWrapper.className = 'msg-wrapper model';
      
      const modelDiv = document.createElement('div');
      modelDiv.className = 'msg';
      modelDiv.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
      modelWrapper.appendChild(modelDiv);
      chatBox.appendChild(modelWrapper);
      autoScroll();

      try {
        const res = await fetch('https://mi-backend-gemini.vercel.app/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: payloadContents })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          throw new Error(errData?.error || 'Error al conectar con el servidor');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let accumulatedText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          accumulatedText += decoder.decode(value, { stream: true });
          modelDiv.innerHTML = marked.parse(accumulatedText);
          autoScroll();
        }

        // Agregar botón de copiar tras completar la respuesta
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        actions.innerHTML = `<button class="copy-btn" onclick="copiarTexto(this)">📋 Copiar</button>`;
        modelWrapper.appendChild(actions);

        history.push({ role: 'model', parts: [{ text: accumulatedText }] });
        uiHistory.push({ role: 'model', html: accumulatedText });
        guardarEnLocalStorage();

      } catch (error) {
        modelDiv.style.color = '#ef4444';
        modelDiv.innerText = `Error: ${error.message}`;
      } finally {
        sendBtn.disabled = false;
        autoScroll();
      }
    }
  </script>
</body>
</html>
